version: '3'

networks:
  mongo-meiiot:
    name: mongo-meiiot
    driver: bridge

services:

  mongos1:
    container_name: mongos1
    image: mongo:latest
    command: mongos --configdb config_rs/configsvr1:27017,configsvr2:27017,configsvr3:27017 --bind_ip_all --port 27017
    ports:
      - 30000:27017
    networks:
      - mongo-meiiot

  mongos2:
    container_name: mongos2
    image: mongo:latest
    command: mongos --configdb config_rs/configsvr1:27017,configsvr2:27017,configsvr3:27017 --bind_ip_all --port 27017
    ports:
      - 30001:27017
    networks:
      - mongo-meiiot

  mongos3:
    container_name: mongos3
    image: mongo:latest
    command: mongos --configdb config_rs/configsvr1:27017,configsvr2:27017,configsvr3:27017 --bind_ip_all --port 27017
    ports:
      - 30002:27017
    networks:
      - mongo-meiiot